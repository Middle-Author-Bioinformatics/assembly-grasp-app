# AWS Amplify build spec — monorepo form.
#
# The app lives in a `frontend/` subfolder, so Amplify treats this as a monorepo
# and REQUIRES the `applications:` + `appRoot:` format.
#
# This file must live at the REPOSITORY ROOT (next to the frontend/ folder). In
# the Amplify console, set "App settings → General → Build settings → App root"
# (Monorepo) to `frontend`, or rely on appRoot below.
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            # `npm install` (not `npm ci`) so a checkout without a committed
            # package-lock.json still builds. If you later commit a lock file,
            # you can switch this back to `npm ci` for reproducible installs.
            - npm install
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
